name: Check static site
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check committed deployment files are up to date
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- images/optimized)"
